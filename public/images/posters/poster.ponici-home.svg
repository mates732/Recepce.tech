<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Ponici.cz — screenshot domovské stránky">
  <defs>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4A36"/>
      <stop offset="1" stop-color="#1A2E22"/>
    </linearGradient>
  </defs>

  <!-- page background -->
  <rect width="600" height="800" fill="#FAF6EC"/>

  <!-- browser chrome -->
  <rect width="600" height="34" fill="#F4F1EA"/>
  <rect y="34" width="600" height="1.5" fill="#E2D3B8"/>
  <circle cx="22" cy="17" r="5" fill="#E5674E"/>
  <circle cx="38" cy="17" r="5" fill="#E3B341"/>
  <circle cx="54" cy="17" r="5" fill="#63A15C"/>
  <rect x="210" y="10" width="180" height="15" rx="7.5" fill="#E8E2D3"/>
  <text x="300" y="20.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8A8474">ponici.cz</text>

  <!-- nav -->
  <rect y="34" width="600" height="40" fill="#FFFFFF"/>
  <rect y="74" width="600" height="1" fill="#EFE8D8"/>
  <text x="28" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#213A2B">ponici.cz</text>
  <text x="390" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6B6A5E">Programy</text>
  <text x="446" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6B6A5E">Galerie</text>
  <text x="492" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6B6A5E">O nás</text>
  <rect x="530" y="46" width="44" height="18" rx="9" fill="#213A2B"/>
  <text x="552" y="58.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#F3EDE0">Kontakt</text>

  <!-- hero -->
  <text x="300" y="120" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="2.5" fill="#7A5230">JEZDECKÁ ŠKOLA · CÍSAŘSKÝ OSTROV</text>
  <text x="300" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#20241F">Místo, kde děti</text>
  <text x="300" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#20241F">rostou s koňmi</text>
  <text x="300" y="228" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7C7666">Výuka jízdy na koni pro děti i dospělé v srdci Prahy —</text>
  <text x="300" y="243" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7C7666">bezpečně, s respektem a láskou ke koním.</text>

  <!-- buttons -->
  <rect x="210" y="268" width="86" height="30" rx="15" fill="#213A2B"/>
  <text x="253" y="287" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#F3EDE0">Přihlásit se</text>
  <rect x="304" y="268" width="86" height="30" rx="15" fill="none" stroke="#213A2B" stroke-opacity="0.4" stroke-width="1"/>
  <text x="347" y="287" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#213A2B">Programy</text>

  <!-- meadow block -->
  <rect x="28" y="318" width="544" height="150" rx="14" fill="url(#meadow)"/>
  <!-- meadow sun glow -->
  <circle cx="300" cy="393" r="70" fill="#F3EDE0" opacity="0.08"/>
  <!-- horseshoe -->
  <g transform="translate(300 370)">
    <path d="M-26 -42 C-26 -12 -12 14 0 14 C12 14 26 -12 26 -42" fill="none" stroke="#F3EDE0" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-17" cy="-23" r="2.4" fill="#F3EDE0" opacity="0.7"/>
    <circle cx="-19" cy="-4" r="2.4" fill="#F3EDE0" opacity="0.7"/>
    <circle cx="19" cy="-4" r="2.4" fill="#F3EDE0" opacity="0.7"/>
    <circle cx="17" cy="-23" r="2.4" fill="#F3EDE0" opacity="0.7"/>
  </g>
  <text x="300" y="452" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="2" fill="#F3EDE0" opacity="0.6">ŽIVOT NA OSTROVĚ</text>

  <!-- info cards -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="28" y="492" width="172" height="74" rx="10" fill="#FFFFFF" stroke="#EFE8D8" stroke-width="1"/>
    <text x="40" y="518" font-size="11" font-weight="600" fill="#20241F">Bezpečí</text>
    <text x="40" y="534" font-size="8.5" fill="#7C7666">jak to u nás funguje</text>
    <rect x="40" y="512" width="10" height="1.5" fill="#7A5230"/>

    <rect x="214" y="492" width="172" height="74" rx="10" fill="#FFFFFF" stroke="#EFE8D8" stroke-width="1"/>
    <text x="226" y="518" font-size="11" font-weight="600" fill="#20241F">Zkušení lektoři</text>
    <text x="226" y="534" font-size="8.5" fill="#7C7666">20+ let s koňmi i dětmi</text>
    <rect x="226" y="512" width="10" height="1.5" fill="#7A5230"/>

    <rect x="400" y="492" width="172" height="74" rx="10" fill="#FFFFFF" stroke="#EFE8D8" stroke-width="1"/>
    <text x="412" y="518" font-size="11" font-weight="600" fill="#20241F">Vztah ke koním</text>
    <text x="412" y="534" font-size="8.5" fill="#7C7666">respekt a důvěra</text>
    <rect x="412" y="512" width="10" height="1.5" fill="#7A5230"/>
  </g>

  <!-- footer strip -->
  <rect y="760" width="600" height="40" fill="#213A2B"/>
  <text x="28" y="784" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#F3EDE0">ponici.cz</text>
  <text x="572" y="784" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="1.5" fill="#F3EDE0" opacity="0.6">CÍSAŘSKÝ OSTROV · PRAHA</text>
</svg>
