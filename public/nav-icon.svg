<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Recepce.tech brand symbol R·
       Geometrické R se zkrácenou levou horní částí, výraznou diagonální
       nožičkou a off-white tečkou vpravo dole. -->
  <rect width="64" height="64" rx="12" fill="#171716"/>
  <!-- R — horní oblouk + pravá svislice -->
  <path d="M 18 46 V 20 Q 18 12 26 12 H 36 Q 46 12 46 22 Q 46 30 38 31.5 L 46 46 H 37.5 L 30.5 33 H 25.5 V 46 Z M 25.5 18.5 V 27 H 35 Q 38.5 27 38.5 22.75 Q 38.5 18.5 35 18.5 Z" fill="#FFFFFF"/>
  <!-- Diagonální nožička -->
  <path d="M 25.5 37 V 46 H 33.5 L 28.5 37 Z" fill="#FFFFFF"/>
  <!-- Tečka vpravo dole -->
  <circle cx="50" cy="43" r="3.5" fill="#F3F0E9"/>
</svg>
